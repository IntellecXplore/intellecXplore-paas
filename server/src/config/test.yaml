app:
  id: "Elysia-Admin-Test"
  port: 3001
  prefix: "/api"
  baseCacheTime: 300
  forgetPasswordExpiresIn: 600
  forgetPasswordUrl: "http://localhost:3006/#/auth/reset-password"
  maxRequestBodySize: 10485760
  timeout: 30
  maxLoginAttempts: 3
  allowPublicRegister: true
  trustProxy: false
  trustedProxyCidrs: []
  corsOrigin: true
  geoIpTimeoutMs: 1500

jwt:
  accessToken:
    expiresIn: "15m"
    secret: "test-access-token-secret"
  refreshToken:
    expiresIn: "7d"
    secret: "test-refresh-token-secret"

redis:
  host: "localhost"
  port: 6379
  password: ""
  username: ""
  db: 1

pg:
  host: "localhost"
  port: 5432
  username: "postgres"
  user: "postgres"
  password: "postgres"
  database: "elysia-admin-test"
  max: 2
  idle_timeout: 10
  connect_timeout: 5
  ssl: false

smtp:
  host: "smtp.qq.com"
  port: 465
  secure: true
  auth:
    user: ""
    pass: ""
  pool: false
  maxConnections: 1
  maxMessages: 1
  rateDelta: 1000
  rateLimit: 5

guard:
  ipBlacklist: false
  apiSwitch: false

agent:
  provider: "openai"
  apiKey: ""
  apiBase: "https://api.deepseek.com"
  model: "deepseek-v4-pro"
  maxTokens: 4096
  maxToolRounds: 5
  conversationTTL: 86400

orders:
  timeout: 900000
